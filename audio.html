<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Колонки и звук — TechNova</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','system-ui','sans-serif']}}}}</script>
<link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased">
<main class="max-w-7xl mx-auto px-4 sm:px-6 pt-32 sm:pt-40">
  <section class="grid lg:grid-cols-2 gap-10 items-center mb-16">
    <div>
      <h1 class="reveal text-4xl sm:text-5xl font-black">Колонки и <span class="gradient-text">звук</span></h1>
      <p class="reveal mt-5 text-slate-300 text-lg" data-delay="100">Мощный бас, чистые высокие и красивая подсветка. Колонки, саундбары и наушники для игр, фильмов и музыки.</p>
      <div class="reveal mt-6 flex items-end gap-1.5 h-16" data-delay="200">
        <span class="w-2 rounded-full grad-bg floaty" style="height:30%"></span><span class="w-2 rounded-full grad-bg floaty" style="height:70%;animation-delay:-.5s"></span><span class="w-2 rounded-full grad-bg floaty" style="height:100%;animation-delay:-1s"></span><span class="w-2 rounded-full grad-bg floaty" style="height:55%;animation-delay:-1.5s"></span><span class="w-2 rounded-full grad-bg floaty" style="height:85%;animation-delay:-2s"></span><span class="w-2 rounded-full grad-bg floaty" style="height:40%;animation-delay:-2.5s"></span><span class="w-2 rounded-full grad-bg floaty" style="height:75%;animation-delay:-3s"></span>
      </div>
    </div>
    <div class="reveal-right flex justify-center"><div class="relative w-full max-w-md"><div class="absolute inset-6 rounded-full bg-purple-600/30 blur-3xl"></div><div class="relative floaty" data-show="speakers,#a855f7,#22d3ee,0"></div></div></div>
  </section>
  <div data-products data-cat="audio" class="grid sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
</main>
<script src="app.js"></script>
</body>
</html>
